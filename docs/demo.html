<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GitHub PR List Status</title>
<style>
  /* GitHub's light and dark theme values for the variables the userscript uses */
  :root {
    --bgColor-default: #fff;
    --bgColor-muted: #f6f8fa;
    --bgColor-neutral-muted: #818b981f;
    --bgColor-success-emphasis: #1f883d;
    --bgColor-attention-muted: #fff8c5;
    --bgColor-danger-muted: #ffebe9;
    --bgColor-done-muted: #fbefff;
    --bgColor-accent-muted: #ddf4ff;
    --bgColor-accent-emphasis: #0969da;
    --fgColor-default: #1f2328;
    --fgColor-muted: #59636e;
    --fgColor-onEmphasis: #fff;
    --fgColor-success: #1a7f37;
    --fgColor-attention: #9a6700;
    --fgColor-danger: #d1242f;
    --fgColor-done: #8250df;
    --fgColor-accent: #0969da;
    --borderColor-default: #d1d9e0;
    --borderColor-attention-emphasis: #9a6700;
    --borderColor-danger-muted: #ff818266;
    --borderColor-done-muted: #c297ff66;
    --borderColor-accent-muted: #54aeff66;
    --display-yellow-bgColor-muted: #ffec9e;
    --display-orange-bgColor-muted: #ffe7d1;
    --display-red-bgColor-muted: #ffe2e0;
    --display-green-bgColor-muted: #caf7ca;
  }
  :root[data-color-mode="dark"] {
    --bgColor-default: #0d1117;
    --bgColor-muted: #151b23;
    --bgColor-neutral-muted: #656c7633;
    --bgColor-success-emphasis: #238636;
    --bgColor-attention-muted: #bb800926;
    --bgColor-danger-muted: #f851491a;
    --bgColor-done-muted: #ab7df826;
    --bgColor-accent-muted: #388bfd1a;
    --bgColor-accent-emphasis: #1f6feb;
    --fgColor-default: #f0f6fc;
    --fgColor-muted: #9198a1;
    --fgColor-onEmphasis: #fff;
    --fgColor-success: #3fb950;
    --fgColor-attention: #d29922;
    --fgColor-danger: #f85149;
    --fgColor-done: #ab7df8;
    --fgColor-accent: #4493f8;
    --borderColor-default: #3d444d;
    --borderColor-attention-emphasis: #9e6a03;
    --borderColor-danger-muted: #f8514966;
    --borderColor-done-muted: #ab7df866;
    --borderColor-accent-muted: #388bfd66;
    --display-yellow-bgColor-muted: #2e1a00;
    --display-orange-bgColor-muted: #311708;
    --display-red-bgColor-muted: #3c0614;
    --display-green-bgColor-muted: #122117;
    color-scheme: dark;
  }
  body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; color: var(--fgColor-default); background: var(--bgColor-default); margin: 0; padding: 24px 32px 40px; }
  .page { max-width: 1240px; margin: 0 auto; }
  .heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .actions { display: flex; gap: 8px; }
  .theme-toggle { height: 32px; padding: 0 12px; border: 1px solid var(--borderColor-default); border-radius: 6px; background: var(--bgColor-muted); color: var(--fgColor-default); font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
  .views { display: inline-flex; padding: 2px; border-radius: 6px; background: var(--bgColor-neutral-muted); }
  .views button { height: 28px; padding: 0 12px; border: 1px solid transparent; border-radius: 5px; background: none; color: var(--fgColor-muted); font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
  .views button[aria-pressed="true"] { background: var(--bgColor-default); border-color: var(--borderColor-default); color: var(--fgColor-default); font-weight: 600; }
  .gear { width: 32px; height: 32px; border: 1px solid var(--borderColor-default); border-radius: 6px; background: var(--bgColor-muted); display: grid; place-items: center; color: var(--fgColor-muted); }
  .search { display: flex; align-items: center; border: 1px solid var(--borderColor-default); border-radius: 6px; padding: 0 12px; height: 34px; margin-bottom: 16px; font-size: 14px; }
  .search .q { flex: 1; }
  .search .kw { color: var(--fgColor-accent); background: var(--bgColor-accent-muted); border-radius: 3px; padding: 0 1px; }
  .search .me { color: var(--fgColor-done); background: var(--bgColor-done-muted); border-radius: 3px; padding: 0 1px; }
  .box { border: 1px solid var(--borderColor-default); border-radius: 6px; overflow: hidden; }
  .box-header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: var(--bgColor-muted); border-bottom: 1px solid var(--borderColor-default); }
  .tab { color: var(--fgColor-muted); display: inline-flex; align-items: center; gap: 6px; }
  .tab.active { color: var(--fgColor-default); font-weight: 600; }
  .count { background: var(--bgColor-neutral-muted); color: var(--fgColor-default); border-radius: 2em; padding: 0 7px; font-size: 12px; font-weight: 500; line-height: 18px; }
  .sort { margin-left: auto; color: var(--fgColor-muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 32px 1fr auto; padding: 10px 16px 10px 12px; border-top: 1px solid var(--borderColor-default); }
  li:first-child { border-top: none; }
  .pr-icon { color: var(--fgColor-success); padding-top: 3px; }
  .title-line { font-size: 16px; font-weight: 600; line-height: 24px; }
  .meta { color: var(--fgColor-muted); font-size: 12px; margin-top: 2px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .meta .pass { color: var(--fgColor-success); }
  .meta .fail { color: var(--fgColor-danger); }
  .meta .ratio { text-decoration: underline; color: var(--fgColor-muted); }
  .comments { color: var(--fgColor-muted); font-size: 12px; display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
  .comment-count { display: inline-flex; align-items: center; gap: 4px; }

  /* Copied from the userscript */
  :root { --prb-row-yellow: #fff8c5; --prb-row-orange: #ffd8b1; --prb-row-red: #ffd0d0; --prb-row-green: #c8f5c8; --prb-hl-solid: #6e7781; }
  [data-color-mode="dark"] { --prb-row-yellow: #2f2a05; --prb-row-orange: #3d1f0d; --prb-row-red: #3c0614; --prb-row-green: #122117; --prb-hl-solid: #6e7681; }
  @media (prefers-color-scheme: dark) {
    [data-color-mode="auto"] { --prb-row-yellow: #2f2a05; --prb-row-orange: #3d1f0d; --prb-row-red: #3c0614; --prb-row-green: #122117; --prb-hl-solid: #6e7681; }
  }
  .prb-group { float: right; display: inline-flex; gap: 6px; margin: 2px 16px 0 12px; }
  .prb { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; line-height: 18px; padding: 0 7px; border-radius: 2em; border: 1px solid transparent; white-space: nowrap; }
  .prb-size { background: var(--bgColor-default, #fff); border-color: var(--borderColor-default, #d1d9e0); color: var(--fgColor-muted, #59636e); font-variant-numeric: tabular-nums; }
  .prb-size .add { color: var(--fgColor-success, #1a7f37); }
  .prb-size .del { color: var(--fgColor-danger, #d1242f); }
  .prb-ready    { background: var(--bgColor-success-emphasis, #1a7f37); color: var(--fgColor-onEmphasis, #fff); }
  .prb-behind   { background: var(--bgColor-attention-muted, #fff8c5); border-color: var(--borderColor-attention-emphasis, #d4a72c); color: var(--fgColor-attention, #9a6700); }
  .prb-conflict { background: var(--bgColor-danger-muted, #ffebe9); border-color: var(--borderColor-danger-muted, #ff818266); color: var(--fgColor-danger, #d1242f); }
  .prb-failing  { background: var(--bgColor-danger-muted, #ffebe9); border-color: var(--borderColor-danger-muted, #ff818266); color: var(--fgColor-danger, #d1242f); }
  .prb-release  { background: var(--bgColor-done-muted, #fbefff); border-color: var(--borderColor-done-muted, #c297ff); color: var(--fgColor-done, #8250df); }
  .prb-blue     { background: var(--bgColor-accent-muted, #ddf4ff); border-color: var(--borderColor-accent-muted, #54aeff66); color: var(--fgColor-accent, #0969da); }
  .prb-running  { background: var(--bgColor-default, #fff); border-color: var(--borderColor-attention-emphasis, #d4a72c); color: var(--fgColor-attention, #9a6700); }
  .prb-blocked  { background: var(--bgColor-neutral-muted, #f6f8fa); border-color: var(--borderColor-default, #d1d9e0); color: var(--fgColor-muted, #59636e); }
  .prb-loading  { background: var(--bgColor-default, #fff); border-color: var(--borderColor-default, #d1d9e0); }
  .prb-spinner { width: 10px; height: 10px; border: 2px solid var(--borderColor-default, #d1d9e0); border-top-color: var(--fgColor-muted, #59636e); border-radius: 50%; animation: prb-spin 0.7s linear infinite; }
  @keyframes prb-spin { to { transform: rotate(360deg); } }
  .prb-dots { margin-left: -4px; }
  .prb-dots span { animation: prb-dot 1.4s infinite; opacity: 0.25; }
  .prb-dots span:nth-child(2) { animation-delay: 0.2s; }
  .prb-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes prb-dot { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .prb-dots span { animation: none; opacity: 1; } }
  .prb-meta-stack { flex-wrap: wrap; justify-content: flex-end; align-content: center; row-gap: 6px; }
  /* The slot reserves the second line. Counts are positioned out of flow so they never widen the column. */
  .prb-reviews { flex-basis: 100%; height: 18px; position: relative; }
  .prb-review-counts { position: absolute; top: 0; right: 0; display: inline-flex; align-items: center; gap: 8px; line-height: 18px; font-size: 12px; color: var(--fgColor-muted, #59636e); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .prb-review-counts .ok { color: var(--fgColor-success, #1a7f37); }
  .prb-review-counts .chg { color: var(--fgColor-danger, #d1242f); }
  .prb-review-counts > span { display: inline-flex; align-items: center; gap: 3px; }
  .prb-review-counts svg { width: 14px; height: 14px; fill: currentColor; }
  .prb-review-counts .rereq svg { width: 16px; height: 16px; }
  .prb-review-counts .rereq circle { fill: var(--bgColor-accent-emphasis, #0969da); }
  .prb-review-counts .rereq path { fill: var(--fgColor-onEmphasis, #fff); }
  .prb-review-counts .waiting { color: var(--fgColor-accent, #0969da); font-weight: 600; }
  .prb-review-counts .waiting svg { width: 16px; height: 16px; }
  .prb-review-counts .waiting circle { fill: var(--bgColor-accent-emphasis, #0969da); }
  .prb-review-counts .waiting path { fill: var(--fgColor-onEmphasis, #fff); }
  .prb-error { color: var(--fgColor-muted, #59636e); font-size: 14px; line-height: 18px; cursor: help; }
  .prb-status { margin-left: auto; text-align: right; font-size: 12px; color: var(--fgColor-attention, #9a6700); }
  .prb-status:empty { display: none; }
  .prb-status > span { cursor: help; }
  .prb-status button { margin-left: 4px; padding: 0; border: 0; background: none; font: inherit; color: var(--fgColor-accent, #0969da); cursor: pointer; }
  .prb-status button:hover { text-decoration: underline; }
  .prb-legend { margin-top: 8px; border: 1px solid var(--borderColor-default, #d1d9e0); border-radius: 6px; font-size: 12px; color: var(--fgColor-muted, #59636e); }
  .prb-legend-body { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px 48px; padding: 12px 16px 16px; }
  .prb-legend-body > div { flex: 0 1 auto; min-width: 260px; }
  .prb-legend h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--fgColor-default, #1f2328); }
  .prb-legend dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 12px; align-items: start; margin: 0; }
  .prb-legend dt { display: flex; align-items: center; min-height: 20px; }
  .prb-legend dd { margin: 0; line-height: 20px; }
  .prb-legend-swatch { width: 32px; height: 16px; border-radius: 4px; border: 1px solid var(--borderColor-default, #d1d9e0); }
  .prb-legend .prb-review-counts { position: static; }
  .prb-footer-bar { display: flex; align-items: center; gap: 12px; margin-top: 8px; min-height: 20px; }
  .prb-footer-title { font-size: 12px; color: var(--fgColor-muted, #59636e); padding-right: 12px; border-right: 1px solid var(--borderColor-default, #d1d9e0); line-height: 16px; text-decoration: none; }
  .prb-footer-title:hover { color: var(--fgColor-accent, #0969da); text-decoration: underline; }
  .prb-footer-toggle { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; font-size: 12px; color: var(--fgColor-muted, #59636e); cursor: pointer; }
  .prb-footer-toggle:hover, .prb-footer-toggle[aria-expanded="true"] { color: var(--fgColor-default, #1f2328); }
  .prb-footer-toggle:hover .prb-toggle-label { text-decoration: underline; }
  .prb-footer-toggle svg { width: 14px; height: 14px; fill: currentColor; }
  .prb-footer-toggle .caret { width: 12px; height: 12px; transition: transform 0.15s; }
  .prb-footer-toggle[aria-expanded="true"] .caret { transform: rotate(180deg); }
  .prb-hl.prb-hl-solid, .prb-hl.prb-hl-rainbow { padding: 1px 5px; margin: 0 -2px; border-radius: 2em; text-decoration: none; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  /* Contrasts at least 3:1 with every row color in both themes, and 4.5:1 with its white text. */
  .prb-hl.prb-hl-solid { background: var(--prb-hl-solid); color: #fff; }
  .prb-hl.prb-hl-rainbow { color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.4); background: repeating-linear-gradient(90deg, #cf222e 0, #bc4c00 40px, #9a6700 80px, #1a7f37 120px, #0969da 160px, #8250df 200px, #cf222e 240px); background-attachment: fixed; animation: prb-rainbow 3s linear infinite; }
  @keyframes prb-rainbow { to { background-position: 240px 0; } }
  @media (prefers-reduced-motion: reduce) { .prb-hl.prb-hl-rainbow { animation: none; } }
  .prb-panel-body { display: flex; flex-wrap: wrap; gap: 16px 48px; padding: 12px 16px 16px; }
  .prb-panel-body > section { flex: 1 1 340px; }
  .prb-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; min-height: 24px; }
  .prb-legend .prb-section-head h4 { margin: 0; }
  .prb-head-controls { display: inline-flex; align-items: center; gap: 6px; }
  .prb-info { position: relative; display: inline-flex; color: var(--fgColor-muted, #59636e); cursor: help; border-radius: 50%; }
  .prb-info:focus-visible { outline: 2px solid var(--fgColor-accent, #0969da); outline-offset: 1px; }
  .prb-info svg { width: 14px; height: 14px; fill: currentColor; }
  .prb-tip { display: none; position: absolute; top: calc(100% + 6px); right: -8px; z-index: 10; width: 300px; padding: 8px 10px; border: 1px solid var(--borderColor-default, #d1d9e0); border-radius: 6px; background: var(--bgColor-default, #fff); box-shadow: 0 8px 24px rgba(37, 41, 46, 0.12); color: var(--fgColor-default, #1f2328); font-size: 12px; font-weight: 400; line-height: 18px; text-align: left; }
  .prb-tip p { margin: 0; }
  .prb-tip p + p { margin-top: 6px; }
  .prb-info:hover .prb-tip, .prb-info:focus .prb-tip { display: block; }
  .prb-note { margin: 8px 0 0; line-height: 18px; }
  .prb-authors { display: flex; flex-wrap: wrap; gap: 6px; }
  .prb-author-btn { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--borderColor-default, #d1d9e0); border-radius: 2em; background: var(--bgColor-default, #fff); color: var(--fgColor-default, #1f2328); font: inherit; font-size: 12px; line-height: 18px; cursor: pointer; }
  .prb-author-btn[aria-pressed="true"] { border-color: var(--fgColor-muted, #59636e); }
  .prb-author-btn .check { width: 10px; }
  .prb-author-btn.absent { color: var(--fgColor-muted, #59636e); border-style: dashed; }
  .prb-seg { display: inline-flex; padding: 2px; border-radius: 6px; background: var(--bgColor-neutral-muted, #818b981f); }
  .prb-seg button { padding: 0 10px; height: 22px; border: 1px solid transparent; border-radius: 5px; background: none; color: var(--fgColor-muted, #59636e); font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
  .prb-seg button[aria-pressed="true"] { background: var(--bgColor-default, #fff); border-color: var(--borderColor-default, #d1d9e0); color: var(--fgColor-default, #1f2328); font-weight: 600; }
  .prb-toggles { display: grid; gap: 8px; margin: 0; }
  .prb-toggles label { display: grid; grid-template-columns: 16px 1fr; column-gap: 8px; align-items: start; cursor: pointer; font-weight: 400; line-height: 18px; }
  .prb-toggles input { margin: 2px 0 0; }
  .prb-toggles .name { color: var(--fgColor-default, #1f2328); font-weight: 500; }
  .prb-toggles .indent { margin-left: 24px; }
  .prb-toggles label.disabled { opacity: 0.5; cursor: default; }
</style>
</head>

    <h1 id="viewTitle">Review requests</h1>

        <button id="viewReview" aria-pressed="true" onclick="setView('review')">Review requests</button>
        <button id="viewMine" aria-pressed="false" onclick="setView('mine')">Authored by me</button>
      </div>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">Switch to dark mode</button>

    </div>
  </div>

  const discussionIcon = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 1h8.5c.966 0 1.75.784 1.75 1.75v5.5A1.75 1.75 0 0 1 10.25 10H7.061l-2.574 2.573A1.458 1.458 0 0 1 2 11.543V10h-.25A1.75 1.75 0 0 1 0 8.25v-5.5C0 1.784.784 1 1.75 1ZM1.5 2.75v5.5c0 .138.112.25.25.25h1a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h3.5a.25.25 0 0 0 .25-.25v-5.5a.25.25 0 0 0-.25-.25h-8.5a.25.25 0 0 0-.25.25Zm13 2a.25.25 0 0 0-.25-.25h-.5a.75.75 0 0 1 0-1.5h.5c.966 0 1.75.784 1.75 1.75v5.5A1.75 1.75 0 0 1 14.25 12H14v1.543a1.458 1.458 0 0 1-2.487 1.03L9.22 12.28a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215l2.22 2.22v-2.19a.75.75 0 0 1 .75-.75h1a.25.25 0 0 0 .25-.25Z"/></svg>';

  const reRequestIcon = '<span class="rereq"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8"/><path transform="translate(3 3) scale(0.625)" d="M8 2c1.981 0 3.671.992 4.933 2.078 1.27 1.091 2.187 2.345 2.637 3.023a1.62 1.62 0 0 1 0 1.798c-.45.678-1.367 1.932-2.637 3.023C11.67 13.008 9.981 14 8 14c-1.981 0-3.671-.992-4.933-2.078C1.797 10.83.88 9.576.43 8.898a1.62 1.62 0 0 1 0-1.798c.45-.677 1.367-1.931 2.637-3.022C4.33 2.992 6.019 2 8 2ZM1.679 7.932a.12.12 0 0 0 0 .136c.411.622 1.241 1.75 2.366 2.717C5.176 11.758 6.527 12.5 8 12.5c1.473 0 2.825-.742 3.955-1.715 1.124-.967 1.954-2.096 2.366-2.717a.12.12 0 0 0 0-.136c-.412-.621-1.242-1.75-2.366-2.717C10.824 4.242 9.473 3.5 8 3.5c-1.473 0-2.825.742-3.955 1.715-1.124.967-1.954 2.096-2.366 2.717ZM8 10a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 10Z"/></svg></span>';

  function reviewPill(rv) {
    if (!rv) return '<span class="prb-reviews"></span>';
    const parts = [['ok', '✓', 'Approved'], ['chg', '✗', 'Changes requested'], ['cmt', discussionIcon, 'Commented']]
      .filter(([k]) => rv[k]?.length);
    if (!parts.length && !rv.waiting) return '<span class="prb-reviews"></span>';
    const waitingTip = rv.waiting
      ? [`${rv.waiting} unresolved ${rv.waiting === 1 ? 'thread is' : 'threads are'} waiting on your reply or reaction` +
        (rv.overLimit ? ` (${rv.overLimit} too long to check, counted to be safe)` : '')]
      : [];
    const tip = [...waitingTip, ...(rv.reRequested ? ['Your review was re-requested'] : []),

    return `<span class="prb-reviews"><span class="prb-review-counts" title="${tip}">` +

      parts.map(([k, icon]) => `<span class="${k}">${icon}${rv[k].length}</span>`).join('') + '</span></span>';

  // Settings mockup. The script would store only differences from these defaults in localStorage.
  const FEATURES = [

    ['lineCounts', 'Line counts', 'Lines added and deleted. 1 request per PR.'],

    ['waitingThreads', 'Threads waiting on you', 'On your PRs only. 1 request per PR with comments.'],

  const LIGHT_OFF = ['checks', 'excludeLockfiles', 'commenters', 'waitingThreads'];
  const settings = Object.fromEntries(FEATURES.map(([k]) => [k, true]));
  // tnguyen is saved but has no PR in either view, so the panel shows the login alone.
  const highlighted = new Set(['dkim', 'tnguyen']);
  let highlightStyle = 'solid';

  const loginOf = (author) => author.match(/\(([^)]+)\)$/)[1].toLowerCase();

  function authorHtml(author) {
    const on = highlighted.has(loginOf(author));
    return on ? `<span class="prb-hl prb-hl-${highlightStyle}">${author}</span>` : author;
  }

  // Without status_checks, merge state alone can only say a PR is failing or blocked.
  function visiblePills(keys) {
    const out = keys.flatMap(k => {
      if (k === 'failing2' || k === 'pipeline') {
        if (settings.checks) return [k];
        return settings.mergeState ? [k === 'failing2' ? 'failing' : 'blocked'] : [];
      }
      if (k === 'checking') return settings.checks || settings.mergeState ? [k] : [];
      return settings.mergeState ? [k] : [];
    });
    const derived = ['failing', 'blocked'];
    const fromMergeState = out.filter(k => !derived.includes(k));
    return fromMergeState.length && !settings.checks ? fromMergeState : [...new Set(out)];
  }

  function visibleReviews(rv) {
    if (!rv) return rv;
    return {
      ok: settings.reviewCounts ? rv.ok : undefined,
      chg: settings.reviewCounts ? rv.chg : undefined,
      cmt: settings.commenters ? rv.cmt : undefined,
      reRequested: settings.commenters && rv.reRequested,
      waiting: settings.waitingThreads ? rv.waiting : 0,
      overLimit: rv.overLimit,
    };
  }

  function renderRow(r) {

    const all = !settings.excludeLockfiles && r.addAll;

      <div>
        <div class="title-line"><span class="prb-group">${pills}</span>${r.title}</div>
        <div class="meta">${r.repo} · ${authorHtml(r.author)} opened ${r.opened} · ${r.review} · ${mark} <span class="ratio">${r.checks[0]}/${r.checks[1]}</span></div>
      </div>
      <div class="comments prb-meta-stack"><span class="comment-count">${commentIcon} ${r.comments}</span>${reviewPill(visibleReviews(r.reviews))}</div>
    </li>`;
  }

  const infoIcon = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>';
  const info = (html) =>
    `<span class="prb-info" tabindex="0" aria-label="More info">${infoIcon}<span class="prb-tip" role="tooltip">${html}</span></span>`;

  function currentPreset() {
    const all = FEATURES.every(([k]) => settings[k]);
    const light = FEATURES.every(([k]) => settings[k] === !LIGHT_OFF.includes(k));
    return all ? 'all' : light ? 'light' : null;
  }

  function renderPanel() {
    const onPage = new Map(currentRows().map(r => [loginOf(r.author), r.author]));
    const logins = [...new Set([...onPage.keys(), ...highlighted])].sort();
    const authors = logins.map(login => {
      const on = highlighted.has(login);
      const name = onPage.get(login) || login;
      const label = on ? `<span class="prb-hl prb-hl-${highlightStyle}">${name}</span>` : name;
      const absent = onPage.has(login) ? '' : ' absent" title="No PRs from this author on this page';
      return `<button type="button" class="prb-author-btn${absent}" aria-pressed="${on}" onclick="toggleAuthor('${login}')">` +
        `<span class="check">${on ? '✓' : ''}</span>${label}</button>`;
    }).join('');
    const seg = (current, options, handler) => '<span class="prb-seg">' + options.map(([value, text]) =>
      `<button type="button" aria-pressed="${current === value}" onclick="${handler}('${value}')">${text}</button>`).join('') + '</span>';
    const toggles = FEATURES.map(([k, name, text, parent]) => {
      const disabled = parent && !settings[parent];
      return `<label class="${parent ? 'indent' : ''}${disabled ? ' disabled' : ''}">` +
        `<input type="checkbox" ${settings[k] ? 'checked' : ''} ${disabled ? 'disabled' : ''} onchange="setFeature('${k}', this.checked)">` +
        `<span><span class="name">${name}</span><br>${text}</span></label>`;
    }).join('');
    document.getElementById('panelBody').innerHTML =
      '<section><div class="prb-section-head"><h4>Highlighted authors</h4>' +
      seg(highlightStyle, [['solid', 'Solid'], ['rainbow', '🌈 Rainbow']], 'setHighlightStyle') + '</div>' +
      `<div class="prb-authors">${authors}</div>` +
      '<p class="prb-note">Click an author to highlight their PRs on every list. Authors you saved stay listed even when they have no PRs on this page, so you can remove them.</p></section>' +
      '<section><div class="prb-section-head"><h4>Features</h4>' +
      '<span class="prb-head-controls">' +
      seg(currentPreset(), [['light', 'Fewer requests'], ['all', 'Enable all']], 'applyPreset') +
      info('<p><b>Fewer requests</b> turns off the features that cost extra requests for each PR. Badges show up sooner, and GitHub is less likely to rate limit you on long lists.</p>' +
        '<p><b>Enable all</b> turns every feature back on.</p>') +
      '</span></div>' +
      `<div class="prb-toggles">${toggles}</div></section>`;
  }

  function refresh() {
    list.innerHTML = currentRows().map(renderRow).join('');
    renderPanel();
  }
  function toggleAuthor(login) {
    highlighted.has(login) ? highlighted.delete(login) : highlighted.add(login);
    refresh();
  }
  function setHighlightStyle(style) {
    highlightStyle = style;
    document.getElementById('legendAuthor').className = `prb-hl prb-hl-${style}`;
    refresh();
  }
  function setFeature(key, on) { settings[key] = on; refresh(); }
  function applyPreset(name) {
    FEATURES.forEach(([k]) => { settings[k] = name === 'all' || !LIGHT_OFF.includes(k); });
    refresh();
  }

  function renderLegend() {
    const swatch = (color) => `<span class="prb-legend-swatch" style="background:${color}"></span>`;
    const badge = (k) => `<span class="prb ${P[k][0]}">${P[k][1]}</span>`;
    const section = (heading, items) => `<div><h4>${heading}</h4><dl>` +
      items.map(([term, text]) => `<dt>${term}</dt><dd>${text}</dd>`).join('') + '</dl></div>';
    const count = (k, icon) => `<span class="prb-review-counts"><span class="${k}">${icon}2</span></span>`;
    return '<div class="prb-legend-body">' +
      section('Row colors', [
        [swatch(GREEN), 'Approved'],
        [swatch('transparent'), 'Not approved, under 1 week old'],
        [swatch(YELLOW), 'Not approved, 1 to 2 weeks old'],
        [swatch(ORANGE), 'Not approved, 2 weeks to 1 month old'],
        [swatch(RED), 'Not approved, over 1 month old'],
      ]) +
      section('Badges', [
        [badge('ready'), 'Approved, checks passing, and up to date'],
        [badge('behind'), 'The branch is behind its base and needs updating'],
        [badge('conflicts'), 'The branch has merge conflicts'],
        [badge('failing2'), 'Checks are failing. Hover to see which ones.'],
        [badge('checking'), 'Checks are running, or GitHub is still checking whether it can merge'],
        [badge('blocked'), 'Approved, but a merge requirement is still unmet'],
        [badge('pipeline'), 'Release Check is failing'],
        ['<span class="prb prb-size"><span class="add">+96</span> <span class="del">−12</span></span>', 'Lines added and deleted, not counting lockfiles'],
        ['<span class="prb-error">⚠</span>', 'Some details didn\'t load. Hover for why.'],
        ['<span class="prb-hl prb-hl-solid" id="legendAuthor">John Doe (jdoe)</span>', 'An author you chose to highlight'],
      ]) +
      section('Reviews', [
        [`<span class="prb-review-counts">${waitingBadge(2)}</span>`, 'Threads awaiting your reply or reaction'],
        [`<span class="prb-review-counts">${reRequestIcon}</span>`, 'You reviewed and were asked to review again'],
        [count('ok', '✓'), 'People who approved'],
        [count('chg', '✗'), 'People who requested changes'],
        [count('cmt', discussionIcon), 'People who commented without deciding'],
      ]) +
      '</div>';
  }

  const list = document.getElementById('rows');
  const legend = document.getElementById('legend');
  legend.innerHTML = renderLegend();

  // GitHub's list switches views from its sidebar; the demo uses a toggle instead.
  function setView(next) {
    view = next;
    const mine = view === 'mine';
    const current = mine ? myRows : rows;
    document.getElementById('viewReview').setAttribute('aria-pressed', String(!mine));
    document.getElementById('viewMine').setAttribute('aria-pressed', String(mine));
    document.getElementById('viewTitle').textContent = mine ? 'Authored by me' : 'Review requests';
    document.getElementById('viewQualifier').textContent = mine ? 'author' : 'review-requested';
    document.getElementById('openCount').textContent = current.length;
    current.filter(r => r.failure).forEach(r => { r.failed = r.failure; r.loading = false; });
    list.innerHTML = current.map(renderRow).join('');
    renderStatus();
    renderPanel();
  }

  const currentRows = () => (view === 'mine' ? myRows : rows);

  // Mirrors the script's status line. Retry here pretends the refetch succeeds.
  function renderStatus() {
    const status = document.getElementById('status');
    const failed = currentRows().filter(r => r.failed);
    if (!failed.length) { status.replaceChildren(); return; }
    const prs = failed.length === 1 ? '1 PR' : `${failed.length} PRs`;
    const tip = failed.map(r => `${r.repo}: ${r.failed}`).join('\n');
    status.innerHTML = `<span title="${tip}">⚠ ${prs} didn't fully load because GitHub rate limited requests ·</span><button type="button" onclick="retry()">Retry</button>`;
  }
  function retry() {
    const current = currentRows();
    current.filter(r => r.failed).forEach(r => {
      Object.assign(r, { failed: null, loading: true });
      setTimeout(() => { r.loading = false; if (currentRows() === current) list.children[current.indexOf(r)].outerHTML = renderRow(r); }, 900);
    });
    list.innerHTML = current.map(renderRow).join('');
    renderStatus();
  }
  setView('review');

  rows.forEach((r, i) => {
    if (!r.cycle) return;
    let phase = 0;
    const step = () => {
      Object.assign(r, r.cycle[phase]);
      if (view === 'review') list.children[i].outerHTML = renderRow(r);
      setTimeout(step, r.cycle[phase].ms);
      phase = (phase + 1) % r.cycle.length;
    };
    step();
  });
</script>
</body>
</html>
